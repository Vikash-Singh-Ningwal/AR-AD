<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>AR Video Experience</title>

  <!-- A-Frame & MindAR -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <!-- UI Styles -->
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #000;
      overflow: hidden;
    }

    /* START SCREEN */
    #startUI {
      position: fixed;
      inset: 0;
      background: linear-gradient(
        135deg,
        rgba(0,0,0,0.9),
        rgba(25,25,25,0.95)
      );
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    .card {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(14px);
      border-radius: 20px;
      padding: 34px 28px;
      width: 90%;
      max-width: 340px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }

    .card h1 {
      color: #fff;
      font-size: 24px;
      margin-bottom: 12px;
    }

    .card p {
      color: #cfcfcf;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 26px;
    }

    #startBtn {
      width: 100%;
      padding: 14px;
      font-size: 18px;
      font-weight: 600;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      color: #fff;
      background: linear-gradient(135deg, #6a5cff, #00d4ff);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    #startBtn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(0,212,255,0.45);
    }

    .hint {
      margin-top: 16px;
      font-size: 12px;
      color: #aaa;
    }
  </style>
</head>

<body>

  <!-- START UI -->
  <div id="startUI">
    <div class="card">
      <h1>📸 AR Video</h1>
      <p>
        Point your camera at the image target<br />
        to see the video come alive.
      </p>
      <button id="startBtn">Start AR</button>
      <div class="hint">🔊 Enable sound • 📱 Allow camera access</div>
    </div>
  </div>

  <!-- AR SCENE -->
  <a-scene
    mindar-image="imageTargetSrc: targets/targets.mind"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <video
        id="madhuVideo"
        src="assets/madhu.mp4"
        loop
        playsinline
        webkit-playsinline
        crossorigin="anonymous">
      </video>

      <video
        id="vikashVideo"
        src="assets/vikash.mp4"
        loop
        playsinline
        webkit-playsinline
        crossorigin="anonymous">
      </video>
    </a-assets>

    <a-camera look-controls="enabled: false"></a-camera>

    <!-- TARGET 0 -->
    <a-entity mindar-image-target="targetIndex: 0">
      <a-video
        src="#madhuVideo"
        width="1"
        height="0.56"
        position="0 0 0">
      </a-video>
    </a-entity>

    <!-- TARGET 1 -->
    <a-entity mindar-image-target="targetIndex: 1">
      <a-video
        src="#vikashVideo"
        width="1"
        height="0.56"
        position="0 0 0">
      </a-video>
    </a-entity>

  </a-scene>

  <!-- SCRIPT -->
  <script>
    const startUI = document.getElementById("startUI");
    const startBtn = document.getElementById("startBtn");

    const madhuVideo = document.getElementById("madhuVideo");
    const vikashVideo = document.getElementById("vikashVideo");

    // Unlock audio on mobile
    startBtn.addEventListener("click", async () => {
      startBtn.innerText = "Loading...";
      startBtn.disabled = true;

      madhuVideo.muted = false;
      vikashVideo.muted = false;

      try {
        await madhuVideo.play(); madhuVideo.pause();
        await vikashVideo.play(); vikashVideo.pause();
      } catch (e) {
        console.log("Autoplay unlocked");
      }

      startUI.style.display = "none";
    });

    // TARGET 0 EVENTS
    const target0 = document.querySelector('[mindar-image-target="targetIndex: 0"]');

    target0.addEventListener("targetFound", () => {
      madhuVideo.currentTime = 0;
      madhuVideo.play();
    });

    target0.addEventListener("targetLost", () => {
      madhuVideo.pause();
    });

    // TARGET 1 EVENTS
    const target1 = document.querySelector('[mindar-image-target="targetIndex: 1"]');

    target1.addEventListener("targetFound", () => {
      vikashVideo.currentTime = 0;
      vikashVideo.play();
    });

    target1.addEventListener("targetLost", () => {
      vikashVideo.pause();
    });
  </script>

</body>
</html>
