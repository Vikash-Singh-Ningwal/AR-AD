<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AR Video Experience</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      background: #000;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
    }

    /* START SCREEN */
    #startUI {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #000, #111);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    .card {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(14px);
      padding: 30px;
      border-radius: 20px;
      width: 90%;
      max-width: 340px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }

    .card h1 {
      color: #fff;
      font-size: 24px;
      margin-bottom: 10px;
    }

    .card p {
      color: #ccc;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    #startBtn {
      width: 100%;
      padding: 14px;
      font-size: 18px;
      font-weight: 600;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      color: #fff;
      background: linear-gradient(135deg, #6a5cff, #00d4ff);
    }

    .hint {
      margin-top: 14px;
      font-size: 12px;
      color: #aaa;
    }

    /* SOUND BUTTON */
    #soundBtn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 20;
      padding: 10px 14px;
      border-radius: 50px;
      border: none;
      font-size: 14px;
      background: rgba(0,0,0,0.6);
      color: #fff;
      display: none;
    }
  </style>
</head>

<body>

<!-- START UI -->
<div id="startUI">
  <div class="card">
    <h1>📸 AR Video</h1>
    <p>
      Tap Start, allow camera access,<br>
      then point at the image target.
    </p>
    <button id="startBtn">Start AR</button>
    <div class="hint">📱 Camera permission required</div>
  </div>
</div>

<!-- SOUND BUTTON -->
<button id="soundBtn">🔊 Sound</button>

<!-- AR SCENE (AUTO START DISABLED) -->
<a-scene
  mindar-image="imageTargetSrc: targets/targets.mind; autoStart: false"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
  embedded>

  <a-assets>
    <!-- MUST BE MUTED -->
    <video
      id="madhuVideo"
      src="assets/madhu.mp4"
      loop
      muted
      playsinline
      webkit-playsinline
      crossorigin="anonymous">
    </video>

    <video
      id="vikashVideo"
      src="assets/vikash.mp4"
      loop
      muted
      playsinline
      webkit-playsinline
      crossorigin="anonymous">
    </video>
  </a-assets>

  <a-camera look-controls="enabled: false"></a-camera>

  <!-- TARGET 0 -->
  <a-entity mindar-image-target="targetIndex: 0">
    <a-video
      src="#madhuVideo"
      width="1"
      height="0.56"
      position="0 0 0">
    </a-video>
  </a-entity>

  <!-- TARGET 1 -->
  <a-entity mindar-image-target="targetIndex: 1">
    <a-video
      src="#vikashVideo"
      width="1"
      height="0.56"
      position="0 0 0">
    </a-video>
  </a-entity>

</a-scene>

<script>
  const startUI = document.getElementById("startUI");
  const startBtn = document.getElementById("startBtn");
  const soundBtn = document.getElementById("soundBtn");

  const madhuVideo = document.getElementById("madhuVideo");
  const vikashVideo = document.getElementById("vikashVideo");

  const sceneEl = document.querySelector("a-scene");

  // START AR AFTER USER CLICK (CRITICAL FIX)
  startBtn.addEventListener("click", async () => {
    startUI.style.display = "none";

    await sceneEl.systems["mindar-image-system"].start();

    // unlock playback (still muted)
    try {
      await madhuVideo.play(); madhuVideo.pause();
      await vikashVideo.play(); vikashVideo.pause();
    } catch (e) {}

    soundBtn.style.display = "block";
  });

  // ENABLE SOUND (OPTIONAL)
  soundBtn.addEventListener("click", () => {
    madhuVideo.muted = false;
    vikashVideo.muted = false;
    soundBtn.textContent = "🔇 Mute";
  });

  // TARGET EVENTS
  const target0 = document.querySelector('[mindar-image-target="targetIndex: 0"]');
  const target1 = document.querySelector('[mindar-image-target="targetIndex: 1"]');

  target0.addEventListener("targetFound", () => {
    vikashVideo.pause();
    madhuVideo.currentTime = 0;
    madhuVideo.play();
  });

  target0.addEventListener("targetLost", () => {
    madhuVideo.pause();
  });

  target1.addEventListener("targetFound", () => {
    madhuVideo.pause();
    vikashVideo.currentTime = 0;
    vikashVideo.play();
  });

  target1.addEventListener("targetLost", () => {
    vikashVideo.pause();
  });

  // STOP CAMERA WHEN TAB HIDDEN (MOBILE STABILITY)
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      sceneEl.systems["mindar-image-system"].stop();
    }
  });
</script>

</body>
</html>
